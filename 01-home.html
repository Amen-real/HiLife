/* =========================================
   DESIGN TOKENS (来源: Design.md)
   ========================================= */
:root {
  /* Brand */
  --primary:       #C8FF00;
  --primary-ink:   #0A0A0A;

  /* Neutrals (warm gray) */
  --n-950: #0A0A0A;
  --n-900: #111111;
  --n-700: #444444;
  --n-600: #707070;
  --n-500: #A0A0A0;
  --n-400: #C7C7C2;
  --n-300: #D9D9D5;
  --n-200: #E8E8E4;
  --n-100: #F1F1EE;
  --n-50:  #F7F7F5;
  --white: #FFFFFF;

  /* Semantic */
  --success: #6F9F00;
  --warning: #FFB020;
  --orange:  #FF9500;      /* 脂肪橙色 */
  --card-gray: #EFEFEB;    /* 打卡/建议卡浅灰底 */

  /* Spacing (8px) */
  --s-1: 4px;  --s-2: 8px;   --s-3: 12px;  --s-4: 16px;
  --s-5: 20px; --s-6: 24px;  --s-7: 32px;

  /* Radius */
  --r-s: 8px; --r-m: 12px; --r-l: 16px; --r-pill: 999px;

  /* Shadow (6-8%) */
  --shadow-card: 0 4px 16px rgba(0,0,0,0.06);

  /* Type */
  --f-zh: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  --f-en: "Inter", "SF Pro Display", system-ui, -apple-system, sans-serif;
}

/* =========================================
   RESET
   ========================================= */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { font-family: var(--f-zh); -webkit-font-smoothing: antialiased; }
button { font-family: inherit; border: none; background: none; cursor: pointer; color: inherit; }
a { color: inherit; text-decoration: none; }
ul, ol { list-style: none; }
img, svg { display: block; max-width: 100%; }

/* =========================================
   PAGE BACKGROUND (preview 容器)
   ========================================= */
body {
  min-height: 100vh;
  background:
    radial-gradient(900px 500px at 50% -10%, #ececea 0%, transparent 60%),
    var(--n-50);
  display: flex; align-items: flex-start; justify-content: center;
  padding: 24px 16px 48px;
}
.preview-meta {
  position: fixed; top: 16px; left: 16px;
  font-family: var(--f-en); font-size: 12px; color: var(--n-600);
  display: flex; align-items: center; gap: 8px;
}
.preview-meta .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); }
.preview-meta .name { font-weight: 700; color: var(--n-900); }

/* Brand mark with green underline */
.brand {
  display: inline-flex; flex-direction: column; align-items: flex-start;
  gap: 4px;
  position: relative; z-index: 3;
}
.brand .name {
  font-size: 14px; font-weight: 800; letter-spacing: 0.02em;
  color: var(--n-900);
}
.brand .underline {
  width: 22px; height: 3px; border-radius: 2px;
  background: var(--success);
}
