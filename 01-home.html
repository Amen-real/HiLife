<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>01 首页 · HiLiLife 衡力健身记录</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =========================================
   DESIGN TOKENS (来源: Design.md)
   ========================================= */
:root {
  /* Brand */
  --primary:       #C8FF00;
  --primary-ink:   #0A0A0A;

  /* Neutrals (warm gray) */
  --n-950: #0A0A0A;
  --n-900: #111111;
  --n-700: #444444;
  --n-600: #707070;
  --n-500: #A0A0A0;
  --n-400: #C7C7C2;
  --n-300: #D9D9D5;
  --n-200: #E8E8E4;
  --n-100: #F1F1EE;
  --n-50:  #F7F7F5;
  --white: #FFFFFF;

  /* Semantic */
  --success: #6F9F00;
  --warning: #FFB020;
  --orange:  #FF9500;      /* 脂肪橙色 */
  --card-gray: #EFEFEB;    /* 打卡/建议卡浅灰底 */

  /* Spacing (8px) */
  --s-1: 4px;  --s-2: 8px;   --s-3: 12px;  --s-4: 16px;
  --s-5: 20px; --s-6: 24px;  --s-7: 32px;

  /* Radius */
  --r-s: 8px; --r-m: 12px; --r-l: 16px; --r-pill: 999px;

  /* Shadow (6-8%) */
  --shadow-card: 0 4px 16px rgba(0,0,0,0.06);

  /* Type */
  --f-zh: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  --f-en: "Inter", "SF Pro Display", system-ui, -apple-system, sans-serif;
}

/* =========================================
   RESET
   ========================================= */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { font-family: var(--f-zh); -webkit-font-smoothing: antialiased; }
button { font-family: inherit; border: none; background: none; cursor: pointer; color: inherit; }
a { color: inherit; text-decoration: none; }
ul, ol { list-style: none; }
img, svg { display: block; max-width: 100%; }

/* =========================================
   PAGE BACKGROUND (preview 容器)
   ========================================= */
body {
  min-height: 100vh;
  background:
    radial-gradient(900px 500px at 50% -10%, #ececea 0%, transparent 60%),
    var(--n-50);
  display: flex; align-items: flex-start; justify-content: center;
  padding: 24px 16px 48px;
}
.preview-meta {
  position: fixed; top: 16px; left: 16px;
  font-family: var(--f-en); font-size: 12px; color: var(--n-600);
  display: flex; align-items: center; gap: 8px;
}
.preview-meta .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); }
.preview-meta .name { font-weight: 700; color: var(--n-900); }

/* =========================================
   PHONE FRAME  390 × 844
   ========================================= */
.phone {
  width: 390px; height: 844px;
  background: var(--n-50);
  border-radius: 36px;
  border: 1px solid var(--n-200);
  box-shadow: 0 20px 50px rgba(0,0,0,0.08), 0 4px 12px rgba(0,0,0,0.04);
  overflow: hidden;
  display: flex; flex-direction: column;
  position: relative;
}

/* Status bar (iOS style) */
.status-bar {
  height: 44px;
  padding: 0 24px;
  display: flex; align-items: center; justify-content: space-between;
  flex: none;
  font-family: var(--f-en); font-weight: 600; font-size: 15px;
  color: var(--n-900);
}
.status-bar .right { display: flex; align-items: center; gap: 6px; }
.status-bar .right svg { width: 16px; height: 16px; }

/* =========================================
   HEADER
   ========================================= */
.header {
  padding: 4px 20px 16px;
  flex: none;
}
.header .greet {
  font-size: 24px; font-weight: 800; letter-spacing: -0.02em;
  color: var(--n-900);
  line-height: 30px;
  display: flex; align-items: center; gap: 6px;
}
.header .sub {
  margin-top: 4px;
  font-size: 13px; font-weight: 500; color: var(--n-600);
  display: flex; align-items: center; gap: 4px;
  letter-spacing: 0;
}
.header .actions {
  position: absolute; top: 50px; right: 20px;
  display: flex; gap: 8px;
}
.header .ic-btn {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--white);
  border: 1px solid var(--n-200);
  display: grid; place-items: center;
  color: var(--n-700);
  transition: background 200ms cubic-bezier(0.16,1,0.3,1), transform 150ms;
}
.header .ic-btn:hover { background: var(--n-100); }
.header .ic-btn:active { transform: scale(0.95); }
.header .ic-btn svg { width: 16px; height: 16px; }

/* Fix: actions shouldn't overlap greeting. Put actions on the row. */
.header {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 12px;
}
.header .lead { flex: 1 1 auto; min-width: 0; }
.header .actions { position: static; flex: none; }

/* =========================================
   SCROLL CONTENT
   ========================================= */
.scroll {
  flex: 1 1 auto;
  overflow-y: auto;
  padding: 0 16px 16px;
  scrollbar-width: none;
}
.scroll::-webkit-scrollbar { display: none; }

/* Section spacing */
.section { margin-top: 16px; }
.section-label {
  font-size: 15px; font-weight: 800; letter-spacing: -0.01em;
  color: var(--n-900);
  margin: 0 4px 10px;
  text-transform: none;
}
.section-label.with-arrow {
  display: flex; align-items: center; justify-content: space-between;
}
.sec-arrow {
  width: 24px; height: 24px;
  display: grid; place-items: center;
  color: var(--n-500);
  border-radius: 50%;
  transition: background 200ms cubic-bezier(0.16,1,0.3,1), color 200ms, transform 150ms;
}
.sec-arrow:hover { background: var(--n-100); color: var(--n-700); }
.sec-arrow:active { transform: scale(0.92); }

/* =========================================
   CARDS
   ========================================= */
.card {
  background: var(--white);
  border: 1px solid var(--n-200);
  border-radius: var(--r-l);
  box-shadow: var(--shadow-card);
}

/* 1) 今日打卡进度 + 2) 健身天数/连续打卡（上下合并为一卡） */
.checkin-group { overflow: hidden; }
.checkin {
  padding: 16px 18px;
  display: flex; align-items: center; gap: 14px;
  background: var(--card-gray);
}
.checkin .meta { flex: 1 1 auto; min-width: 0; }
.checkin .meta .label { font-size: 12px; font-weight: 600; color: var(--n-600); }
.checkin .meta .val {
  margin-top: 6px;
  font-family: var(--f-en);
  font-size: 22px; font-weight: 700; line-height: 28px;
  letter-spacing: -0.02em;
  color: var(--n-900);
  display: flex; align-items: baseline; gap: 4px;
}
.checkin .meta .val .x { font-size: 18px; color: var(--n-500); font-weight: 600; }
.checkin .meta .val .total { font-size: 14px; color: var(--n-600); font-weight: 500; margin-left: 4px; }

/* Ring */
.ring {
  --size: 76px; --w: 8px; --pct: 0;
  width: var(--size); height: var(--size);
  border-radius: 50%;
  background: conic-gradient(
    #E4FF6E 0%,
    #C8FF00 calc(var(--pct) * 0.5%),
    #7CB800 calc(var(--pct) * 1%),
    var(--n-200) calc(var(--pct) * 1%) 100%
  );
  display: grid; place-items: center;
  position: relative;
  flex: none;
}
.ring::before {
  content: ""; position: absolute; inset: var(--w);
  background: var(--card-gray); border-radius: 50%;
}
.ring > span {
  position: relative; z-index: 1;
  font-family: var(--f-en);
  font-size: 18px; font-weight: 800; letter-spacing: -0.02em;
  color: var(--n-900);
}

/* 2) 健身天数 + 连续打卡（打卡卡下方，中间分隔线） */
.stats {
  display: grid; grid-template-columns: 1fr 1fr;
  border-top: 1px solid var(--n-200);
  padding: 14px 0;
  background: var(--white);
}
.stat {
  padding: 0 16px;
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px;
}
.stat + .stat { border-left: 1px solid var(--n-200); }
.stat .meta { min-width: 0; }
.stat .meta .label { font-size: 12px; color: var(--n-600); font-weight: 500; }
.stat .meta .val {
  margin-top: 6px;
  font-family: var(--f-en);
  font-size: 22px; font-weight: 800; line-height: 28px;
  letter-spacing: -0.02em;
  color: var(--n-900);
  display: flex; align-items: baseline; gap: 2px;
}
.stat .meta .val .unit { font-size: 12px; color: var(--n-500); font-weight: 600; margin-left: 2px; }
.stat .ic {
  width: 32px; height: 32px; border-radius: 10px;
  display: grid; place-items: center;
  flex: none;
}
.stat .ic.flame {
  background: #FFF1D6;
  color: #FFB020;
}

/* 3) 今日建议 (main card) */
.suggest {
  padding: 14px 16px;
  display: flex; align-items: center; gap: 14px;
  background: var(--card-gray);
  cursor: pointer;
  transition: transform 150ms cubic-bezier(0.16,1,0.3,1);
}
.suggest:active { transform: scale(0.99); }
.suggest .photo {
  width: 48px; height: 48px; border-radius: var(--r-m);
  background: var(--n-100);
  display: grid; place-items: center;
  flex: none;
  font-size: 24px;
}
.suggest .body { flex: 1 1 auto; min-width: 0; }
.suggest .body .t1 {
  font-size: 15px; font-weight: 700; color: var(--n-900);
  letter-spacing: -0.01em;
}
.suggest .body .t2 {
  margin-top: 4px;
  font-size: 12px; color: var(--n-600); font-weight: 500;
}
.suggest .arrow {
  color: var(--n-500); flex: none;
  width: 20px; height: 20px;
}

/* 4) 今日饮食 */
.diet .top {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px;
}
.diet .top .num {
  font-family: var(--f-en);
  font-size: 22px; font-weight: 800; letter-spacing: -0.02em;
  line-height: 28px;
  color: var(--n-900);
  display: flex; align-items: baseline; gap: 4px;
}
.diet .top .num .target { font-size: 14px; color: var(--n-600); font-weight: 500; }
.diet .top .pct {
  font-family: var(--f-en);
  font-size: 22px; font-weight: 800;
  color: var(--n-900);
  letter-spacing: -0.02em;
}
.diet .progress {
  height: 6px; border-radius: var(--r-pill);
  background: var(--n-200);
  overflow: hidden;
  margin-bottom: 14px;
}
.diet .progress > i {
  display: block; height: 100%;
  background: linear-gradient(90deg, #0A0A0A 0%, #2A3310 50%, #A6C24A 100%);
  width: 64%;
  border-radius: var(--r-pill);
}
.diet .nut {
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0;
}
.diet .nut .col {
  padding: 0 4px;
  border-right: 1px solid var(--n-200);
}
.diet .nut .col:last-child { border-right: none; }
.diet .nut .col.fat-col {
  display: flex; align-items: center; justify-content: space-between;
  gap: 6px;
}
.diet .nut .col .nut-arrow {
  width: 24px; height: 24px; flex: none;
  display: grid; place-items: center;
  color: var(--n-500);
  border-radius: 50%;
  transition: background 200ms cubic-bezier(0.16,1,0.3,1), color 200ms, transform 150ms;
}
.diet .nut .col .nut-arrow:hover { background: var(--n-100); color: var(--n-700); }
.diet .nut .col .nut-arrow:active { transform: scale(0.92); }
.diet .nut .col .name {
  font-size: 12px; color: var(--n-600); font-weight: 500;
}
.diet .nut .col .v {
  margin-top: 4px;
  font-family: var(--f-en);
  font-size: 13px; font-weight: 700; color: var(--n-900);
  letter-spacing: -0.01em;
  line-height: 18px;
}
.diet .nut .col .v .unit { font-size: 11px; color: var(--n-500); font-weight: 600; margin-left: 2px; }
.diet .nut .col .v.carb,
.diet .nut .col .v.carb .unit { color: var(--success); }
.diet .nut .col .v.fat,
.diet .nut .col .v.fat .unit { color: var(--orange); }

/* 5) 体重趋势 */
.weight {
  padding: 16px 18px;
  display: flex; align-items: center; gap: 16px;
}
.weight .meta { flex: 1 1 auto; min-width: 0; }
.weight .meta .num {
  font-family: var(--f-en);
  font-size: 28px; font-weight: 800; line-height: 34px;
  letter-spacing: -0.03em;
  color: var(--n-900);
  display: flex; align-items: baseline; gap: 2px;
}
.weight .meta .num .unit { font-size: 14px; color: var(--n-600); font-weight: 600; margin-left: 4px; }
.weight .meta .delta {
  margin-top: 2px;
  display: inline-flex; align-items: center; gap: 2px;
  font-family: var(--f-en); font-size: 12px;
  color: var(--success); font-weight: 700;
}
.weight .meta .delta .arr { font-size: 10px; }
.weight .chart { flex: 1 1 auto; min-width: 0; }

/* =========================================
   BOTTOM TAB BAR
   ========================================= */
.tab-bar {
  height: 72px;
  background: var(--white);
  border-top: 1px solid var(--n-200);
  display: grid; grid-template-columns: repeat(5, 1fr);
  flex: none;
  padding-bottom: 8px;
}
.tab {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 4px;
  font-size: 11px; font-weight: 600;
  color: var(--n-600);
  letter-spacing: 0.02em;
  padding-top: 8px;
  cursor: pointer;
  transition: color 200ms cubic-bezier(0.16,1,0.3,1);
}
.tab .ic { width: 24px; height: 24px; display: grid; place-items: center; }
.tab .ic svg { width: 22px; height: 22px; }
.tab.active { color: var(--success); }
.tab.active .ic { color: var(--success); }

/* =========================================
   A11Y · focus
   ========================================= */
button:focus-visible, a:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
  border-radius: 4px;
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>

<div class="preview-meta">
  <span class="dot"></span>
  <span class="name">01 · 首页</span>
  <span>·</span>
  <span>390 × 844 · Light</span>
</div>

<div class="phone" role="application" aria-label="HiLiLife 衡力健身记录 · 首页">

  <!-- ============== STATUS BAR ============== -->
  <div class="status-bar">
    <span>9:41</span>
    <div class="right">
      <!-- signal -->
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M2 22h2V11H2v11zm5 0h2V14H7v8zm4 0h2V8h-2v14zm4 0h2V5h-2v17zm4 0h2V2h-2v20z"/></svg>
      <!-- wifi -->
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 18a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM5 13a10 10 0 0 1 14 0l-1.5 1.5a8 8 0 0 0-11 0L5 13zm-3-3a14 14 0 0 1 20 0l-1.5 1.5a12 12 0 0 0-17 0L2 10zm-3-3a18 18 0 0 1 26 0l-1.5 1.5a16 16 0 0 0-23 0L-1 7z"/></svg>
      <!-- battery -->
      <svg viewBox="0 0 28 14" fill="none" aria-hidden="true">
        <rect x="0.5" y="0.5" width="23" height="13" rx="3" stroke="currentColor" stroke-opacity="0.5"/>
        <rect x="2" y="2" width="20" height="10" rx="2" fill="currentColor"/>
        <rect x="25" y="4" width="2" height="6" rx="1" fill="currentColor" fill-opacity="0.5"/>
      </svg>
    </div>
  </div>

  <!-- ============== HEADER ============== -->
  <div class="header">
    <div class="lead">
      <div class="greet">早上好, Alex <span aria-hidden="true">👋</span></div>
      <div class="sub">今天也要加油完成训练!</div>
    </div>
    <div class="actions">
      <button class="ic-btn" aria-label="更多">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/>
        </svg>
      </button>
      <button class="ic-btn" aria-label="设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- ============== SCROLL CONTENT ============== -->
  <div class="scroll">

    <!-- 1+2) 今日打卡进度 + 健身天数/连续打卡（上下合并为一卡） -->
    <div class="card checkin-group">
      <div class="checkin">
        <div class="meta">
          <div class="label">今日打卡进度</div>
          <div class="val">
            <span>3</span>
            <span class="x">/</span>
            <span class="total">4 项已完成</span>
          </div>
        </div>
        <div class="ring" style="--pct:75" aria-label="完成度 75%">
          <span>75%</span>
        </div>
      </div>
      <div class="stats">
        <div class="stat">
          <div class="meta">
            <div class="label">健身天数</div>
            <div class="val">23<span class="unit">天</span></div>
          </div>
        </div>
        <div class="stat">
          <div class="meta">
            <div class="label">连续打卡</div>
            <div class="val">7<span class="unit">天</span></div>
          </div>
          <div class="ic flame" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M12 2c1 3 3 4 3 7a3 3 0 0 1-1 2c1 0 3-1 3-3 2 2 3 4 3 7a7 7 0 0 1-14 0c0-3 2-5 4-7 0 2 1 3 2 3 0-3-1-6 0-9z"/>
            </svg>
          </div>
        </div>
      </div>
    </div>

    <!-- 3) 今日建议 -->
    <div class="section">
      <div class="section-label">今日建议</div>
      <div class="card suggest" role="button" tabindex="0">
        <div class="photo" aria-hidden="true">
          <!-- dumbbell-like workout icon -->
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#0A0A0A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="6" cy="12" r="2"/>
            <circle cx="18" cy="12" r="2"/>
            <path d="M9 8v8M15 8v8M9 12h6"/>
          </svg>
        </div>
        <div class="body">
          <div class="t1">全身训练 · 中级</div>
          <div class="t2">预计 45 分钟 · 320 kcal</div>
        </div>
        <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m9 6 6 6-6 6"/>
        </svg>
      </div>
    </div>

    <!-- 4) 今日饮食 -->
    <div class="section">
      <div class="section-label">今日饮食</div>
      <div class="card diet" style="padding:14px 16px">
        <div class="top">
          <div class="num">
            <span>1,350</span>
            <span class="target">/ 2,100 kcal</span>
          </div>
          <div class="pct">64%</div>
        </div>
        <div class="progress" role="progressbar" aria-valuenow="64" aria-valuemin="0" aria-valuemax="100">
          <i></i>
        </div>
        <div class="nut">
          <div class="col">
            <div class="name">蛋白质</div>
            <div class="v">98<span class="unit">/ 140g</span></div>
          </div>
          <div class="col">
            <div class="name">碳水</div>
            <div class="v carb">132<span class="unit">/ 220g</span></div>
          </div>
          <div class="col fat-col">
            <div class="meta">
              <div class="name">脂肪</div>
              <div class="v fat">42<span class="unit">/ 70g</span></div>
            </div>
            <button class="nut-arrow" type="button" aria-label="查看脂肪详情">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- 5) 体重趋势 -->
    <div class="section">
