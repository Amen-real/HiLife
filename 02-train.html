<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =========================================
   DESIGN TOKENS (来源: Design.md)
   ========================================= */
:root {
  --primary:      #C8FF00;
  --primary-ink:  #0A0A0A;
  --primary-dim:  #ECFFC2;

  --n-950: #0A0A0A;
  --n-900: #111111;
  --n-700: #444444;
  --n-600: #707070;
  --n-500: #A0A0A0;
  --n-400: #C7C7C2;
  --n-300: #D9D9D5;
  --n-200: #E8E8E4;
  --n-100: #F1F1EE;
  --n-50:  #F7F7F5;
  --white: #FFFFFF;

  --success: #6F9F00;
  --warning: #FFB020;
  --orange:  #FF9500;
  --card-gray: #EFEFEB;

  --r-s: 8px; --r-m: 12px; --r-l: 16px; --r-pill: 999px;
  --shadow-card: 0 4px 16px rgba(0,0,0,0.06);

  --f-zh: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  --f-en: "Inter", "SF Pro Display", system-ui, -apple-system, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { font-family: var(--f-zh); -webkit-font-smoothing: antialiased; }
button { font-family: inherit; border: none; background: none; cursor: pointer; color: inherit; }
a { color: inherit; text-decoration: none; }
ul, ol { list-style: none; }
img, svg { display: block; max-width: 100%; }

body {
  min-height: 100vh;
  background:
    radial-gradient(900px 500px at 50% -10%, #ececea 0%, transparent 60%),
    var(--n-50);
  display: flex; align-items: flex-start; justify-content: center;
  padding: 24px 16px 48px;
}
.preview-meta {
  position: fixed; top: 16px; left: 16px;
  font-family: var(--f-en); font-size: 12px; color: var(--n-600);
  display: flex; align-items: center; gap: 8px;
}
.preview-meta .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); }
.preview-meta .name { font-weight: 700; color: var(--n-900); }

/* =========================================
   PHONE FRAME  390 × 844
   ========================================= */
.phone {
  width: 390px; height: 844px;
  background: var(--n-50);
  border-radius: 36px;
  border: 1px solid var(--n-200);
  box-shadow: 0 20px 50px rgba(0,0,0,0.08), 0 4px 12px rgba(0,0,0,0.04);
  overflow: hidden;
  display: flex; flex-direction: column;
  position: relative;
}

.status-bar {
  height: 44px;
  padding: 0 24px;
  display: flex; align-items: center; justify-content: space-between;
  flex: none;
  font-family: var(--f-en); font-weight: 600; font-size: 15px;
  color: var(--n-900);
}
.status-bar .right { display: flex; align-items: center; gap: 6px; }
.status-bar .right svg { width: 16px; height: 16px; }

/* =========================================
   HEADER  动作库 / 收藏
   ========================================= */
.header {
  padding: 4px 20px 12px;
  flex: none;
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px;
}
.header .lead { display: flex; align-items: center; gap: 24px; }
.header .title {
  font-size: 22px; font-weight: 500;
  color: var(--n-500);
  letter-spacing: -0.01em;
  padding-bottom: 4px;
  border-bottom: 2px solid transparent;
  cursor: pointer;
  transition: color 200ms cubic-bezier(0.16,1,0.3,1);
}
.header .title.active {
  color: var(--n-900); font-weight: 800;
  border-bottom-color: var(--primary);
}
.header .actions { display: flex; gap: 8px; flex: none; }
.header .ic-btn {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--white);
  border: 1px solid var(--n-200);
  display: grid; place-items: center;
  color: var(--n-700);
  transition: background 200ms cubic-bezier(0.16,1,0.3,1), transform 150ms;
}
.header .ic-btn:hover { background: var(--n-100); }
.header .ic-btn:active { transform: scale(0.95); }
.header .ic-btn svg { width: 16px; height: 16px; }

/* =========================================
   SCROLL
   ========================================= */
.scroll {
  flex: 1 1 auto;
  overflow-y: auto;
  padding: 0 0 16px;
  scrollbar-width: none;
}
.scroll::-webkit-scrollbar { display: none; }

/* =========================================
   SEARCH
   ========================================= */
.search {
  margin: 0 16px 0;
  padding: 0 14px;
  height: 44px;
  background: var(--n-100);
  border: 1px solid var(--n-200);
  border-radius: var(--r-m);
  display: flex; align-items: center; gap: 10px;
  cursor: text;
}
.search svg { width: 16px; height: 16px; color: var(--n-500); flex: none; }
.search input {
  flex: 1 1 auto; min-width: 0;
  border: none; background: none; outline: none;
  font: inherit; font-size: 14px;
  color: var(--n-900);
  font-family: var(--f-zh);
}
.search input::placeholder { color: var(--n-500); }

/* =========================================
   CATEGORIES  6 个分类
   ========================================= */
.categories {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 4px;
  padding: 16px 12px;
}
.cat {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  cursor: pointer;
}
.cat .ic {
  width: 48px; height: 48px;
  border-radius: 50%;
  background: var(--n-100);
  display: grid; place-items: center;
  color: var(--n-700);
  transition: background 200ms cubic-bezier(0.16,1,0.3,1), color 200ms, transform 200ms;
}
.cat .ic svg { width: 26px; height: 26px; }
.cat:active .ic { transform: scale(0.94); }
.cat.active .ic { background: var(--primary); color: var(--primary-ink); }
.cat .name {
  font-size: 11px; font-weight: 600;
  color: var(--n-700);
  transition: color 200ms;
}
.cat.active .name { color: var(--n-900); font-weight: 700; }

/* =========================================
   SECTION TITLE
   ========================================= */
.section { padding: 8px 16px 16px; }
.section-label {
  font-size: 15px; font-weight: 800; letter-spacing: -0.01em;
  color: var(--n-900);
  margin: 0 4px 10px;
}

/* =========================================
   EXERCISE CARD
   ========================================= */
.card {
  background: var(--white);
  border: 1px solid var(--n-200);
  border-radius: var(--r-m);
  box-shadow: var(--shadow-card);
}
.exercise {
  padding: 12px;
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 10px;
  cursor: pointer;
  transition: transform 150ms cubic-bezier(0.16,1,0.3,1);
}
.exercise:last-child { margin-bottom: 0; }
.exercise:active { transform: scale(0.99); }

.exercise .photo {
  width: 72px; height: 72px;
  border-radius: var(--r-m);
  flex: none;
  overflow: hidden;
  position: relative;
  background: linear-gradient(135deg, #2A2A2A 0%, #0A0A0A 100%);
}
.exercise .photo::after {
  content: ""; position: absolute; inset: 0;
  background: radial-gradient(circle at 30% 25%, rgba(255,255,255,0.08), transparent 50%);
  pointer-events: none;
}
.exercise .photo svg { width: 100%; height: 100%; }

.exercise .body { flex: 1 1 auto; min-width: 0; }
.exercise .body .name {
  font-size: 15px; font-weight: 700; color: var(--n-900);
  letter-spacing: -0.01em;
}
.exercise .body .en {
  font-size: 11px; color: var(--n-600); font-weight: 500;
  margin-top: 2px;
  font-family: var(--f-en);
  letter-spacing: 0.01em;
}
.exercise .body .tag {
  display: inline-flex; align-items: center;
  margin-top: 6px;
  padding: 2px 8px;
  background: var(--primary-dim);
  color: var(--success);
  border-radius: 6px;
  font-size: 11px; font-weight: 700;
}

.exercise .star {
  width: 32px; height: 32px;
  display: grid; place-items: center;
  color: var(--n-400);
  flex: none;
  border-radius: 50%;
  transition: color 200ms cubic-bezier(0.16,1,0.3,1), background 200ms, transform 150ms;
}
.exercise .star:hover { background: var(--n-100); }
.exercise .star svg { width: 20px; height: 20px; }
.exercise .star.on { color: var(--orange); }
.exercise .star:active { transform: scale(0.9); }

/* =========================================
   BOTTOM TAB BAR
   ========================================= */
.tab-bar {
  height: 72px;
  background: var(--white);
  border-top: 1px solid var(--n-200);
  display: grid; grid-template-columns: repeat(5, 1fr);
  flex: none;
  padding-bottom: 8px;
}
.tab {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 4px;
  font-size: 11px; font-weight: 600;
  color: var(--n-600);
  letter-spacing: 0.02em;
  padding-top: 8px;
  cursor: pointer;
  transition: color 200ms cubic-bezier(0.16,1,0.3,1);
}
.tab .ic { width: 24px; height: 24px; display: grid; place-items: center; }
.tab .ic svg { width: 22px; height: 22px; }
.tab.active { color: var(--primary); }
.tab.active .ic { color: var(--primary); }

/* A11Y */
button:focus-visible, a:focus-visible, input:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
  border-radius: 4px;
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
