<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =========================================
   DESIGN TOKENS (来源: Design.md, 与 01/02 同步)
   ========================================= */
:root {
  --primary:      #C8FF00;
  --primary-ink:  #0A0A0A;
  --primary-dim:  #ECFFC2;

  --n-950: #0A0A0A;
  --n-900: #111111;
  --n-700: #444444;
  --n-600: #707070;
  --n-500: #A0A0A0;
  --n-400: #C7C7C2;
  --n-300: #D9D9D5;
  --n-200: #E8E8E4;
  --n-100: #F1F1EE;
  --n-50:  #F7F7F5;
  --white: #FFFFFF;

  --success: #6F9F00;
  --warning: #FFB020;
  --orange:  #FF9500;
  --card-gray: #EFEFEB;

  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px;
  --s-5: 20px; --s-6: 24px; --s-7: 32px;

  --r-s: 8px; --r-m: 12px; --r-l: 16px; --r-pill: 999px;
  --shadow-card: 0 4px 16px rgba(0,0,0,0.06);

  --f-zh: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  --f-en: "Inter", "SF Pro Display", system-ui, -apple-system, sans-serif;
}

/* RESET */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { font-family: var(--f-zh); -webkit-font-smoothing: antialiased; }
button { font-family: inherit; border: none; background: none; cursor: pointer; color: inherit; }
a { color: inherit; text-decoration: none; }
ul, ol { list-style: none; }
img, svg { display: block; max-width: 100%; }

/* PAGE BACKGROUND */
body {
  min-height: 100vh;
  background:
    radial-gradient(900px 500px at 50% -10%, #ececea 0%, transparent 60%),
    var(--n-50);
  display: flex; align-items: flex-start; justify-content: center;
  padding: 24px 16px 48px;
}
.preview-meta {
  position: fixed; top: 16px; left: 16px;
  font-family: var(--f-en); font-size: 12px; color: var(--n-600);
  display: flex; align-items: center; gap: 8px;
}
.preview-meta .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); }
.preview-meta .name { font-weight: 700; color: var(--n-900); }

/* PHONE FRAME 390×844 */
.phone {
  width: 390px; height: 844px;
  background: var(--n-50);
  border-radius: 36px;
  border: 1px solid var(--n-200);
  box-shadow: 0 20px 50px rgba(0,0,0,0.08), 0 4px 12px rgba(0,0,0,0.04);
  overflow: hidden;
  display: flex; flex-direction: column;
  position: relative;
}

.status-bar {
  height: 44px;
  padding: 0 24px;
  display: flex; align-items: center; justify-content: space-between;
  flex: none;
  font-family: var(--f-en); font-weight: 600; font-size: 15px;
  color: var(--n-900);
}
.status-bar .right { display: flex; align-items: center; gap: 6px; }
.status-bar .right svg { width: 16px; height: 16px; }

/* =========================================
   HEADER   我的计划
   ========================================= */
.header {
  padding: 4px 20px 12px;
  flex: none;
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px;
}
.header h1 {
  font-size: 26px; font-weight: 800;
  letter-spacing: -0.02em;
  color: var(--n-900);
}
.header .actions { display: flex; gap: 8px; flex: none; }
.header .ic-btn {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--white);
  border: 1px solid var(--n-200);
  display: grid; place-items: center;
  color: var(--n-700);
  transition: background 200ms cubic-bezier(0.16,1,0.3,1), transform 150ms;
}
.header .ic-btn:hover { background: var(--n-100); }
.header .ic-btn:active { transform: scale(0.95); }
.header .ic-btn svg { width: 16px; height: 16px; }

/* =========================================
   SEGMENT SWITCH   我的计划 / 模板推荐
   Active = 荧光绿胶囊背景 + 黑字
   Inactive = 透明 + 灰字
   ========================================= */
.segment {
  padding: 4px 16px 14px;
  flex: none;
}
.segment-inner {
  display: flex; gap: 4px;
  background: var(--n-100);
  padding: 4px;
  border-radius: var(--r-pill);
}
.seg-tab {
  flex: 1;
  height: 36px;
  display: grid; place-items: center;
  border-radius: var(--r-pill);
  font-size: 14px; font-weight: 700;
  color: var(--n-600);
  transition: background 200ms cubic-bezier(0.16,1,0.3,1), color 200ms, transform 150ms;
  cursor: pointer;
  letter-spacing: -0.01em;
}
.seg-tab:active { transform: scale(0.97); }
.seg-tab.active {
  background: var(--primary);
  color: var(--primary-ink);
  box-shadow: 0 2px 8px rgba(200,255,0,0.35);
}

/* =========================================
   SCROLL
   ========================================= */
.scroll {
  flex: 1 1 auto;
  overflow-y: auto;
  padding: 0 0 16px;
  scrollbar-width: none;
}
.scroll::-webkit-scrollbar { display: none; }

.section { padding: 8px 16px 16px; }
.section-label {
  font-size: 15px; font-weight: 800; letter-spacing: -0.01em;
  color: var(--n-900);
  margin: 0 4px 10px;
}

/* =========================================
   CURRENT PLANS  (我的计划 列表)
   ========================================= */
.plans { display: flex; flex-direction: column; gap: 12px; }

.plan {
  background: var(--white);
  border: 1px solid var(--n-200);
  border-radius: var(--r-l);
  padding: 16px;
  box-shadow: var(--shadow-card);
  cursor: pointer;
  transition: transform 150ms cubic-bezier(0.16,1,0.3,1), box-shadow 200ms;
}
.plan:hover { box-shadow: 0 6px 18px rgba(0,0,0,0.08); }
.plan:active { transform: scale(0.99); }

.plan .row-top {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 12px;
  margin-bottom: 10px;
}
.plan .title {
  font-size: 16px; font-weight: 800; letter-spacing: -0.01em;
  color: var(--n-900);
  line-height: 1.4;
}
.plan .chev {
  width: 24px; height: 24px; flex: none;
  display: grid; place-items: center;
  color: var(--n-500);
  margin-top: 2px;
}
.plan .chev svg { width: 14px; height: 14px; }

.plan .meta {
  display: flex; gap: 12px;
  font-size: 12px;
  color: var(--n-700);
  margin-bottom: 12px;
}
.plan .meta .label { font-weight: 600; }
.plan .meta .dot {
  display: inline-block; width: 2px; height: 2px;
  background: var(--n-400); border-radius: 50%;
  margin-top: 7px;
}

/* progress */
.plan .progress-row {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px;
  margin-bottom: 6px;
}
.plan .progress-label {
  font-size: 12px; font-weight: 600;
  color: var(--n-700);
  letter-spacing: 0;
}
.plan .progress-pct {
  font-family: var(--f-en);
  font-size: 14px; font-weight: 800;
  color: var(--n-900);
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
}
.plan .progress {
  height: 6px;
  background: var(--n-100);
  border-radius: var(--r-pill);
  overflow: hidden;
}
.plan .progress > i {
  display: block; height: 100%;
  background: linear-gradient(90deg, #0A0A0A 0%, #2A3310 55%, #A6C24A 100%);
  border-radius: var(--r-pill);
  transition: width 600ms cubic-bezier(0.16,1,0.3,1);
}

/* level tag inside plan title area - subtle */
.plan .level {
  display: inline-flex; align-items: center;
  height: 22px; padding: 0 8px;
  background: var(--primary-dim);
  color: var(--success);
  border-radius: var(--r-s);
  font-size: 11px; font-weight: 800;
  margin-right: 6px;
  letter-spacing: 0;
}

/* =========================================
   RECOMMEND TEMPLATES (推荐模板)
   ========================================= */
.recs { display: flex; flex-direction: column; gap: 12px; }

.rec {
  background: var(--white);
  border: 1px solid var(--n-200);
  border-radius: var(--r-l);
  padding: 12px;
  box-shadow: var(--shadow-card);
  display: flex; align-items: center; gap: 14px;
  cursor: pointer;
  transition: transform 150ms cubic-bezier(0.16,1,0.3,1), box-shadow 200ms;
}
.rec:hover { box-shadow: 0 6px 18px rgba(0,0,0,0.08); }
.rec:active { transform: scale(0.99); }

.rec .photo {
  width: 72px; height: 72px; flex: none;
  border-radius: var(--r-m);
  overflow: hidden;
  position: relative;
}
.rec .photo svg { width: 100%; height: 100%; display: block; }
.rec .body { flex: 1 1 auto; min-width: 0; }
.rec .body .t {
  font-size: 15px; font-weight: 800; letter-spacing: -0.01em;
  color: var(--n-900);
  line-height: 1.4;
  margin-bottom: 4px;
}
.rec .body .sub {
  font-size: 12px; font-weight: 600;
  color: var(--n-600);
}
.rec .chev-wrap {
  width: 24px; height: 24px; flex: none;
  display: grid; place-items: center;
  color: var(--n-500);
}
.rec .chev-wrap svg { width: 14px; height: 14px; }

/* =========================================
   TAB BAR  (与 02 一致; 计划 active)
   ========================================= */
.tab-bar {
  flex: none;
  height: 64px;
  background: var(--white);
  border-top: 1px solid var(--n-200);
  display: flex; align-items: center; justify-content: space-around;
  padding: 0 8px;
}
.tab {
  flex: 1;
  height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 4px;
  color: var(--n-500);
  cursor: pointer;
  transition: color 200ms cubic-bezier(0.16,1,0.3,1), transform 150ms;
  font-size: 11px; font-weight: 600;
}
.tab:active { transform: scale(0.92); }
.tab .ic {
  width: 26px; height: 26px;
  display: grid; place-items: center;
}
.tab .ic svg { width: 22px; height: 22px; stroke-width: 2.2; }
.tab.active {
  color: var(--primary);
}
.tab.active .ic svg { fill: rgba(200,255,0,0.12); }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
