<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>11 体重趋势 · HiLiLife</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =========================================
   DESIGN TOKENS  (与 01-10 同步)
   ========================================= */
:root {
  --primary:      #C8FF00;
  --primary-ink:  #0A0A0A;
  --primary-dim:  #ECFFC2;
  --olive:        #A6C24A;

  --n-950: #0A0A0A;
  --n-900: #111111;
  --n-700: #444444;
  --n-600: #707070;
  --n-500: #A0A0A0;
  --n-400: #C7C7C2;
  --n-300: #D9D9D5;
  --n-200: #E8E8E4;
  --n-100: #F1F1EE;
  --n-50:  #F7F7F5;
  --white: #FFFFFF;

  --success: #6F9F00;
  --warning: #FFB020;
  --orange:  #FF9500;
  --card-gray: #EFEFEB;

  --r-s: 8px; --r-m: 12px; --r-l: 16px; --r-pill: 999px;
  --shadow-card: 0 4px 16px rgba(0,0,0,0.06);

  --f-zh: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  --f-en: "Inter", "SF Pro Display", system-ui, -apple-system, sans-serif;
  --f-cn: "PingFang SC", "Inter", system-ui, -apple-system, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { font-family: var(--f-zh); -webkit-font-smoothing: antialiased; }
button { font-family: inherit; border: none; background: none; cursor: pointer; color: inherit; }
a { color: inherit; text-decoration: none; }
ul, ol { list-style: none; }
img, svg { display: block; max-width: 100%; }

body {
  min-height: 100vh;
  background:
    radial-gradient(900px 500px at 50% -10%, #ececea 0%, transparent 60%),
    var(--n-50);
  display: flex; align-items: flex-start; justify-content: center;
  padding: 24px 16px 48px;
}
.preview-meta {
  position: fixed; top: 16px; left: 16px;
  font-family: var(--f-en); font-size: 12px; color: var(--n-600);
  display: flex; align-items: center; gap: 8px;
}
.preview-meta .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); }
.preview-meta .name { font-weight: 700; color: var(--n-900); }

/* PHONE 390x844 */
.phone {
  width: 390px; height: 844px;
  background: var(--n-50);
  border-radius: 36px;
  border: 1px solid var(--n-200);
  box-shadow: 0 20px 50px rgba(0,0,0,0.08), 0 4px 12px rgba(0,0,0,0.04);
  overflow: hidden;
  display: flex; flex-direction: column;
  position: relative;
}

/* STATUS BAR */
.status-bar {
  height: 44px;
  padding: 0 24px;
  display: flex; align-items: center; justify-content: space-between;
  flex: none;
  font-family: var(--f-en); font-weight: 600; font-size: 15px;
  color: var(--n-900);
}
.status-bar .right { display: flex; align-items: center; gap: 6px; }
.status-bar .right svg { width: 16px; height: 16px; }

/* HEADER */
.header {
  height: 56px;
  padding: 0 20px;
  display: flex; align-items: center; justify-content: space-between;
  flex: none;
}
.header h1 {
  font-size: 22px; font-weight: 800;
  letter-spacing: -0.02em; color: var(--n-900);
}
.header .share {
  width: 36px; height: 36px;
  display: grid; place-items: center;
  border-radius: 50%;
  color: var(--n-700);
  cursor: pointer;
  transition: background 200ms;
}
.header .share:hover { background: var(--n-100); }
.header .share:focus-visible {
  outline: 2px solid var(--primary); outline-offset: 2px;
}

/* MAIN scroll */
.main {
  flex: 1;
  overflow-y: auto;
  padding: 6px 20px 24px;
}

/* Time filter pills (7天 / 30天 / 90天 / 全部) */
.time-pills {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-bottom: 18px;
}
.time-pills button {
  height: 36px;
  border-radius: var(--r-pill);
  background: var(--white);
  border: 1px solid var(--n-200);
  font-family: var(--f-cn);
  font-size: 13px; font-weight: 700;
  color: var(--n-700);
  letter-spacing: 0.01em;
  cursor: pointer;
  transition: background 200ms, color 200ms, border-color 200ms, transform 150ms;
}
.time-pills button:hover { background: var(--n-100); }
.time-pills button.on {
  background: var(--primary);
  border-color: var(--primary);
  color: var(--n-900);
}
.time-pills button:active { transform: scale(0.97); }
.time-pills button:focus-visible {
  outline: 2px solid var(--primary); outline-offset: 2px;
}

/* 3 stats row (平均/最低/最高) */
.stats-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0;
  margin-bottom: 18px;
}
.stats-row .stat {
  display: flex; flex-direction: column; gap: 6px;
  padding: 4px 0;
}
.stats-row .stat .label {
  font-family: var(--f-cn);
  font-size: 12px; font-weight: 700;
  color: var(--n-700);
  letter-spacing: 0.04em;
}
.stats-row .stat .value {
  display: inline-flex; align-items: baseline;
  font-family: var(--f-en);
  font-size: 22px; font-weight: 800;
  color: var(--n-900);
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}
.stats-row .stat .value .unit {
  font-family: var(--f-en);
  font-size: 13px; font-weight: 700;
  color: var(--n-700);
  margin-left: 3px;
}

/* Section card (shared) */
.card {
  background: var(--white);
  border: 1px solid var(--n-200);
  border-radius: var(--r-l);
  padding: 16px 18px;
  box-shadow: var(--shadow-card);
  margin-bottom: 14px;
}
.card .label {
  font-family: var(--f-cn);
  font-size: 12px; font-weight: 700;
  color: var(--n-900);
  letter-spacing: 0.04em;
  margin-bottom: 10px;
}

/* Standalone section label (placed outside a card) */
.section-label {
  font-family: var(--f-cn);
  font-size: 14px; font-weight: 800;
  color: var(--n-900);
  letter-spacing: 0.02em;
  margin: 6px 4px 10px;
}

/* Chart card */
.chart-card {
  padding: 14px 14px 12px;
  background: var(--white);
}
.chart-wrap {
  position: relative;
  width: 100%;
  height: 200px;
  padding: 6px 6px 22px 32px;
}
.chart-wrap .y-axis {
  position: absolute;
  left: 0; top: 6px; bottom: 22px;
  display: flex; flex-direction: column; justify-content: space-between;
  font-family: var(--f-en);
  font-size: 11px; font-weight: 600;
  color: var(--n-400);
  font-variant-numeric: tabular-nums;
}
.chart-wrap .grid {
  position: absolute;
  left: 32px; right: 6px; top: 6px; bottom: 22px;
  display: flex; flex-direction: column; justify-content: space-between;
}
.chart-wrap .grid i {
  display: block; height: 1px;
  background: var(--n-200);
  opacity: 0.7;
}
.chart-wrap .x-axis {
  position: absolute;
  left: 32px; right: 6px; bottom: 2px;
  display: flex; justify-content: space-between;
  font-family: var(--f-en);
  font-size: 11px; font-weight: 600;
  color: var(--n-400);
  font-variant-numeric: tabular-nums;
}
.chart-wrap svg.line {
  position: absolute;
  left: 32px; right: 6px; top: 6px; bottom: 22px;
  width: calc(100% - 38px); height: calc(100% - 28px);
  overflow: visible;
}

/* Black tooltip (62.4 kg / 5/16) */
.tooltip {
  position: absolute;
  right: 14px; top: 18px;
  background: var(--n-950);
  color: #fff;
  border-radius: var(--r-s);
  padding: 8px 10px;
  min-width: 84px;
  text-align: left;
  font-family: var(--f-cn);
  font-size: 12px; font-weight: 700;
  letter-spacing: 0.01em;
  z-index: 2;
  pointer-events: none;
  box-shadow: 0 6px 16px rgba(0,0,0,0.18);
}
.tooltip .kg {
  font-family: var(--f-en);
  font-size: 15px; font-weight: 800;
  color: #fff;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
  display: block;
  margin-bottom: 2px;
}
.tooltip .date {
  font-size: 11px; font-weight: 600;
  color: #C8C8C2;
  display: inline-flex; align-items: center; gap: 5px;
}
.tooltip .date .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--primary);
  flex: none;
}

/* Record list */
.records {
  display: flex; flex-direction: column;
}
.records .row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 0;
  border-bottom: 1px solid var(--n-100);
}
.records .row:last-child { border-bottom: none; }
.records .row .date {
  font-family: var(--f-en);
  font-size: 14px; font-weight: 600;
  color: var(--n-700);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
}
.records .row .kg {
  font-family: var(--f-en);
  font-size: 15px; font-weight: 800;
  color: var(--n-900);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
  display: inline-flex; align-items: baseline;
}
.records .row .kg .unit {
  font-family: var(--f-en);
  font-size: 12px; font-weight: 700;
  color: var(--n-700);
  margin-left: 3px;
}

/* View more — fluorescent-green filled pill (readable on light bg) */
.more-link {
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100%;
  margin: 6px 0 4px;
  padding: 13px 0;
  border-radius: var(--r-pill);
  background: var(--primary);
  color: var(--n-900);
  font-family: var(--f-cn);
  font-size: 14px; font-weight: 700;
  letter-spacing: 0.06em;
  cursor: pointer;
  transition: opacity 200ms, transform 150ms;
}
.more-link:hover { opacity: 0.88; }
.more-link:active { transform: scale(0.985); }
.more-link:focus-visible {
  outline: 2px solid var(--primary); outline-offset: 2px; border-radius: var(--r-pill);
}

/* Bottom Tab */
.tab {
  flex: none;
  height: 76px;
  background: var(--white);
  border-top: 1px solid var(--n-200);
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  padding: 8px 8px 22px;
}
.tab .item {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 4px;
  cursor: pointer;
  color: var(--n-500);
  font-family: var(--f-cn);
  font-size: 11px; font-weight: 600;
  transition: color 200ms, transform 150ms;
}
.tab .item .ic {
  width: 36px; height: 36px;
  display: grid; place-items: center;
  border-radius: 50%;
  color: var(--n-500);
  transition: background 200ms, color 200ms;
}
.tab .item .ic svg { display: block; }
.tab .item .t { letter-spacing: 0.02em; }
.tab .item.on .ic { background: var(--primary); color: var(--ink); }
.tab .item.on .t { color: var(--ink); }
.tab .item:active { transform: scale(0.96); }
.tab .item:focus-visible {
  outline: 2px solid var(--primary); outline-offset: 2px; border-radius: var(--r-s);
}

/* Reduce motion */
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
</head>
