<head>

<title>06 · 训练记录 · HiLiLife</title>
<style>
:root {
  --bg: #F7F7F5;
  --card: #FFFFFF;
  --card-2: #F2F2EE;
  --line: #ECECE8;
  --line-soft: #F1F1EE;
  --ink: #0A0A0A;
  --ink-2: #2A2A2A;
  --n-500: #6A6A66;
  --n-400: #8A8A85;
  --n-300: #B5B5B0;
  --n-200: #DCDCD6;
  --n-100: #EFEFEB;
  --primary: #C8FF00;
  --primary-ink: #0A0A0A;
  --success: #6F9F00;
  --orange: #FF9500;
  --shadow-card: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.03);
  --shadow-pop: 0 2px 8px rgba(0,0,0,0.05);
  --f-cn: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
  --f-en: "Inter", "SF Pro Display", system-ui, sans-serif;
  --r-s: 8px;
  --r-m: 12px;
  --r-l: 16px;
  --r-xl: 20px;
  --r-pill: 999px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; min-height: 100%; background: #E8E8E5; font-family: var(--f-cn); -webkit-font-smoothing: antialiased; }
body { display: grid; place-items: center; padding: 24px 0; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

/* META */
.preview-meta {
  position: fixed; top: 12px; left: 16px;
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 11px; font-weight: 600; color: #666;
  background: rgba(255,255,255,0.85);
  padding: 6px 12px; border-radius: var(--r-pill);
  border: 1px solid var(--line);
  z-index: 100; backdrop-filter: blur(8px);
}
.preview-meta .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--primary); }

/* PHONE */
.phone {
  width: 390px; height: 844px;
  background: var(--bg);
  border-radius: 44px;
  overflow: hidden;
  position: relative;
  display: flex; flex-direction: column;
  box-shadow: 0 30px 80px rgba(0,0,0,0.12);
  color: var(--ink);
}

/* STATUS */
.status-bar {
  flex: none;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 28px 6px;
  font-size: 15px; font-weight: 700;
}
.status-bar .right { display: flex; gap: 6px; align-items: center; }
.status-bar svg { width: 16px; height: 16px; }

/* HEADER */
.header {
  flex: none;
  padding: 4px 16px 12px;
  display: flex; align-items: center; justify-content: space-between;
}
.header .lead { display: flex; align-items: center; gap: 24px; }
.header .title {
  font-size: 22px; font-weight: 500;
  color: var(--n-500);
  letter-spacing: -0.01em;
  padding-bottom: 4px;
  border-bottom: 2px solid transparent;
  cursor: pointer;
  transition: color 200ms cubic-bezier(0.16,1,0.3,1);
}
.header .title.active {
  color: var(--ink); font-weight: 800;
  border-bottom-color: var(--primary);
}
.header .right { display: flex; gap: 4px; }
.header .ic-btn {
  width: 36px; height: 36px;
  display: grid; place-items: center;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 50%;
  color: var(--ink);
  transition: background 200ms;
}
.header .ic-btn:hover { background: var(--n-100); }
.header .ic-btn:active { background: var(--line); }
.header .ic-btn svg { width: 18px; height: 18px; }

/* SCROLL */
.scroll {
  flex: 1 1 auto;
  overflow-y: auto;
  padding: 0 16px 100px;
  scrollbar-width: none;
}
.scroll::-webkit-scrollbar { display: none; }

/* MONTH SELECTOR */
.month {
  display: inline-flex; align-items: center; gap: 6px;
  margin: 4px 4px 14px;
  font-size: 15px; font-weight: 800;
  letter-spacing: -0.01em;
  color: var(--ink);
  cursor: pointer;
}
.month:active { opacity: 0.6; }
.month svg { width: 14px; height: 14px; }

/* WEEKDAY */
.weekdays {
  display: grid; grid-template-columns: repeat(7, 1fr);
  margin-bottom: 8px;
}
.weekday {
  text-align: center;
  font-size: 11px; font-weight: 600;
  color: var(--n-400);
  letter-spacing: 0.02em;
  padding: 6px 0;
}

/* DATE ROW */
.dates {
  display: grid; grid-template-columns: repeat(7, 1fr);
  margin-bottom: 18px;
}
.date {
  position: relative;
  height: 40px;
  display: grid; place-items: center;
  font-family: var(--f-en);
  font-size: 14px; font-weight: 500;
  color: var(--ink-2);
  border-radius: 50%;
  cursor: pointer;
  font-variant-numeric: tabular-nums;
  transition: background 200ms;
}
.date.muted { color: var(--n-300); }
.date:not(.active):not(.muted):hover { background: var(--n-100); }
.date.active {
  width: 32px;
  height: 32px;
  background: var(--ink);
  color: #A6C24A;
  font-weight: 600;
}
.date.has-record::after {
  content: "";
  position: absolute; left: 50%; bottom: 4px;
  transform: translateX(-50%);
  width: 4px; height: 4px;
  border-radius: 50%;
  background: var(--primary);
}
.date.active.has-record::after { background: var(--primary); }

/* DAY SUMMARY (inside .records-card) */
.records-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-l);
  box-shadow: var(--shadow-card);
  overflow: hidden;
  margin-bottom: 14px;
}
.day-card {
  background: var(--n-100);
  padding: 14px 16px;
  border-bottom: 1px solid var(--line);
}
.day-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px;
}
.day-date {
  display: inline-flex; align-items: center;
  font-family: var(--f-en);
  font-size: 13px; font-weight: 700;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
}
.day-stats {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 0;
}
.day-stat {
  display: flex; flex-direction: column; align-items: center;
  padding: 0 4px;
  position: relative;
}
.day-stat + .day-stat::before {
  content: "";
  position: absolute; left: 0; top: 6px; bottom: 6px;
  width: 1px; background: var(--line);
}
.day-stat .v {
  font-family: var(--f-en);
  font-size: 22px; font-weight: 600;
  color: var(--ink);
  letter-spacing: -0.02em;
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
}
.day-stat:nth-child(1) .v,
.day-stat:nth-child(2) .v,
.day-stat:nth-child(3) .v {
  font-size: 16px;
  font-weight: 600;
  color: var(--n-500);
}
.day-stat:nth-child(1) { align-items: flex-start; }
.day-stat:nth-child(3) .v { font-family: var(--f-cn); }
.day-stat:nth-child(1) .v {
  font-weight: 800;
  color: var(--ink);
}
.day-stat .unit {
  font-family: var(--f-en);
  font-size: 11px; font-weight: 600;
  color: var(--n-400);
  margin-left: 2px;
}
.day-stat .lab {
  font-family: var(--f-cn);
  font-size: 16px; font-weight: 600;
  color: var(--n-500);
  margin-left: 0;
  letter-spacing: -0.02em;
}

/* EXERCISE LIST (inside .records-card) */
.ex-list {
  display: flex; flex-direction: column;
  background: var(--card);
}
.ex-row {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 14px;
  background: var(--card);
  cursor: pointer;
  transition: background 200ms;
  position: relative;
}
.ex-row + .ex-row { border-top: 1px solid var(--line); }
.ex-row:hover { background: #FBFBFA; }
.ex-row:active { background: var(--n-100); }
.ex-thumb {
  width: 52px; height: 52px;
  flex: none;
  background: linear-gradient(135deg, #2A2A2A 0%, #0A0A0A 100%);
  border-radius: var(--r-m);
  display: grid; place-items: center;
  position: relative;
  overflow: hidden;
}
.ex-thumb::after {
  content: "";
  position: absolute; inset: 0;
  background: radial-gradient(circle at 30% 25%, rgba(200,255,0,0.18), transparent 60%);
}
.ex-thumb svg { width: 38px; height: 38px; position: relative; z-index: 1; }
.ex-body { flex: 1 1 auto; min-width: 0; }
.ex-name {
  font-size: 14px; font-weight: 800;
  color: var(--ink);
  letter-spacing: -0.01em;
  line-height: 1.2;
}
.ex-meta {
  font-size: 11px; font-weight: 600;
  color: var(--n-500);
  margin-top: 4px;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0;
}
.ex-right {
  flex: none;
  font-family: var(--f-en);
  font-size: 14px; font-weight: 600;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
}
.ex-right .unit {
  font-family: var(--f-cn);
  font-size: 11px; font-weight: 600;
  color: var(--n-400);
  margin-left: 2px;
}

/* BOTTOM TAB */
.tabbar {
  position: absolute; left: 0; right: 0; bottom: 0;
  height: 84px;
  padding: 10px 8px 22px;
  display: grid; grid-template-columns: repeat(5, 1fr);
  background: rgba(255,255,255,0.92);
  border-top: 1px solid var(--line);
  backdrop-filter: blur(12px);
  z-index: 10;
}
.tab {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px;
  cursor: pointer;
  color: var(--n-400);
  font-size: 10px; font-weight: 600;
  letter-spacing: 0.02em;
  transition: color 200ms;
}
.tab .ic {
  width: 28px; height: 28px;
  display: grid; place-items: center;
  border-radius: 8px;
  transition: background 200ms;
}
.tab .ic svg { width: 22px; height: 22px; }
.tab.active { color: var(--ink); }
.tab.active .ic { background: var(--primary); color: var(--primary-ink); }
.tab:active { opacity: 0.6; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
